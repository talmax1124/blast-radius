<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Newsreader";
      src: url("Newsreader.ttf") format("truetype");
      font-weight: 400 800;
      font-style: normal;
    }
    @font-face {
      font-family: "Newsreader";
      src: url("Newsreader-Italic.ttf") format("truetype");
      font-weight: 400 800;
      font-style: italic;
    }
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("IBMPlexSans-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #efece4;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      color: #0c0e0c;
      background: #efece4;
    }
    .paper {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(239, 236, 228, 0.42) 0%, rgba(239, 236, 228, 0.62) 100%),
        url("paper-og.jpg") center / cover no-repeat;
    }
    .inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 96px 60px;
    }
    .folio {
      width: 780px;
      display: flex;
      justify-content: space-between;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #a39a8c;
    }
    .rule-top {
      width: 780px;
      height: 1px;
      background: #0c0e0c;
      opacity: 0.58;
      margin-top: 16px;
    }
    .nameplate {
      width: 780px;
      text-align: center;
      padding: 22px 0 18px;
      border-bottom: 3px double rgba(12, 14, 12, 0.72);
    }
    .kicker {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #7d9a86;
    }
    h1 {
      font-family: "Newsreader", serif;
      font-optical-sizing: auto;
      font-weight: 700;
      font-size: 118px;
      letter-spacing: -0.035em;
      line-height: 0.86;
      color: #0c0e0c;
      margin-top: 8px;
    }
    h1 .prefix {
      display: block;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.42em;
      line-height: 1;
      margin-bottom: 10px;
      padding-left: 0.42em;
    }
    .brick {
      width: 780px;
      height: 3px;
      background: #c45c4a;
      margin-top: 0;
    }
    .deck {
      width: 780px;
      text-align: center;
      font-family: "Newsreader", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 22px;
      line-height: 1.25;
      color: #0c0e0c;
      opacity: 0.72;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="paper"></div>
    <div class="inner">
      <div class="folio">
        <span>Vol. 2 · Night desk</span>
        <span>The boxes</span>
      </div>
      <div class="rule-top"></div>
      <div class="nameplate">
        <p class="kicker">MLB prop desk</p>
        <h1><span class="prefix">MLB</span>GREAT RUN</h1>
      </div>
      <div class="brick"></div>
      <p class="deck">Daily 2/3/6 slips graded from the boxes.</p>
    </div>
  </div>
</body>
</html>
